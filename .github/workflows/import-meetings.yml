name: Import BoardDocs Meetings

on:
  schedule:
    - cron: '0 9 * * *'  # 9am UTC daily
  workflow_dispatch:      # allow manual trigger from Actions tab

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger import
        run: |
          MAX_ATTEMPTS=5

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            if ! RESPONSE=$(curl -sS --connect-timeout 10 --max-time 30 \
              -w '\n%{http_code}' -X POST \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -H "Content-Type: application/json" \
              "${{ secrets.APP_URL }}/api/cron/import-meetings"); then
              echo "Import request failed before receiving an HTTP response."
              exit 1
            fi

            HTTP_CODE=${RESPONSE##*$'\n'}
            BODY=${RESPONSE%$'\n'*}
            echo "Attempt $ATTEMPT: HTTP $HTTP_CODE"
            echo "$BODY"

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              exit 0
            fi

            if [ "$HTTP_CODE" = "530" ] && echo "$BODY" | grep -q "error code: 1033" && [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "Cloudflare tunnel unavailable; retrying in 15 seconds..."
              sleep 15
              continue
            fi

            exit 1
          done
